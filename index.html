<style>
  :root {

  .progress.good { background: var(--good-soft); } .progress.good > div { background: var(--good); }
  .progress.warn { background: var(--warn-soft); } .progress.warn > div { background: var(--warn); }
  .progress.over { background: var(--critical-soft); } .progress.over > div { background: var(--critical); }

  .alert { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: 14px; font-weight: 500; }
  .alert.info { background: var(--primary-soft); color: #173f73; border: 1px solid #c9dcf5; }
  .alert.warn { background: var(--warn-soft); color: #5c3c00; border: 1px solid #f5d68f; }

  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }

  .drop-zone { display: block; border: 2px dashed #9ec5f4; border-radius: 16px; padding: 30px 20px; text-align: center; cursor: pointer; background: var(--primary-soft); transition: background .15s, border-color .15s; }
  .drop-zone:hover, .drop-zone.over { background: #d9e8fb; border-color: var(--primary); }
  .drop-zone .dz-icon { font-size: 38px; line-height: 1; }
  .drop-zone .dz-title { font-size: 19px; font-weight: 800; color: var(--primary-strong); margin-top: 8px; }
  .drop-zone .dz-sub { color: var(--ink-2); margin-top: 4px; font-size: 14px; }
  .drop-zone.busy { pointer-events: none; opacity: .75; }
  .or-sep { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 18px 0 12px; }
  .or-sep::before, .or-sep::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .loading { display: grid; place-items: center; min-height: 60vh; color: var(--muted); gap: 14px; }
  .spinner { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy-bar { position: fixed; top: 0; right: 0; left: 0; height: 3px; z-index: 300; background: linear-gradient(90deg, transparent, var(--primary), transparent); background-size: 50% 100%; animation: busy 1s linear infinite; }
  @keyframes busy { from { background-position: -50% 0; } to { background-position: 150% 0; } }

  @media (max-width: 640px) { .topbar { padding: 10px 16px; } .modal-body { padding: 16px; } .modal-head { padding: 16px 16px 0; } .modal-foot { padding: 12px 16px 16px; } }
</style>

<style>

      q.set(k, args[i] === true ? '1' : args[i] === false ? '0' : String(args[i]));
    });
    const opt = fn === 'dDriverPdf' ? { method: 'POST', body: String(args[1] || ''), headers: { 'Content-Type': 'text/plain;charset=utf-8' } } : {};
    let res, data, lastErr;
    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        res = await fetch(`${API_URL}?${q.toString()}`, opt);
        if (res.ok) {
          const txt = await res.text();
          if (txt.charAt(0) === '{') { data = JSON.parse(txt); lastErr = null; break; }
          lastErr = new Error('השרת החזיר תשובה לא צפויה');   // גוגל מחזיר לפעמים דף HTML – מנסים שוב
        } else lastErr = new Error(`שגיאת שרת (${res.status})`);
      } catch (err) { lastErr = new Error('אין חיבור לאינטרנט'); }
      await new Promise((r) => setTimeout(r, 600 * (attempt + 1)));
    }
    if (lastErr) throw lastErr;
    if (!data.ok) throw new Error(data.error || 'שגיאה');
    return data.data;
  } finally { setBusy(-1); }
}

// ---------------------------------------------------------------- ממשק
function toast(message, { type = 'info', timeout = 4500 } = {}) {
  let host = $('.toasts');
  if (!host) { host = document.createElement('div'); host.className = 'toasts'; document.body.appendChild(host); }
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.setAttribute('role', 'status');
  el.innerHTML = `<div class="t-icon">${{ good: '✓', error: '!', warn: '!', info: 'i' }[type] || 'i'}</div><div class="t-text">${message}</div>`;
  host.appendChild(el);
  while (host.children.length > 3) host.firstChild.remove();
  if (timeout) setTimeout(() => el.remove(), timeout);
  return () => el.remove();
}

function openModal({ title, body = '', buttons = [], onOpen, width, dismissible = true }) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="${width ? `width:min(${width}px,100%)` : ''}">
    <div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-x aria-label="סגירה">✕</button></div>
    <div class="modal-body"></div>${buttons.length ? '<div class="modal-foot"></div>' : ''}</div>`;
  const bodyEl = $('.modal-body', back);
  if (typeof body === 'string') bodyEl.innerHTML = body; else bodyEl.appendChild(body);
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = (e) => { if (e.key === 'Escape' && dismissible) { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  $('[data-x]', back).onclick = close;
  const foot = $('.modal-foot', back);
  buttons.forEach((b) => {
    const el = document.createElement('button');
    el.className = `btn ${b.className || 'btn-ghost'}`;
    el.innerHTML = b.label;
    el.onclick = async () => {
      if (!b.onClick) return close();
      $$('button', foot).forEach((x) => { x.disabled = true; });
      try { const keep = await b.onClick(close, back); if (keep !== true) close(); }
      catch (err) { toast(esc(err.message), { type: 'error', timeout: 7000 }); }
      finally { $$('button', foot).forEach((x) => { x.disabled = false; }); }
    };
    foot.appendChild(el);
  });
  if (dismissible) back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
  document.body.appendChild(back);
  if (onOpen) onOpen(back, close);
  return close;
}

function confirmDialog(title, html, okLabel = 'אישור', danger = false) {
  return new Promise((resolve) => {
    let answered = false;
    const close = openModal({
      title, body: `<div style="font-size:16px">${html}</div>`,
      buttons: [
        { label: okLabel, className: danger ? 'btn-danger' : 'btn-primary', onClick: () => { answered = true; resolve(true); } },
        { label: 'ביטול', onClick: () => { answered = true; resolve(false); } },
      ],
    });
    const obs = new MutationObserver(() => { if (!document.querySelector('.modal-back')) { obs.disconnect(); if (!answered) resolve(false); } });
    obs.observe(document.body, { childList: true });
    return close;
  });
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }
}

// ---------------------------------------------------------------- אימות (זהה לשרת)
function isValidIsraeliId(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (!d || d.length > 9 || /^0+$/.test(d)) return false;
  d = d.padStart(9, '0');
  let sum = 0;
  for (let i = 0; i < 9; i++) { let n = Number(d[i]) * ((i % 2) + 1); sum += n > 9 ? n - 9 : n; }
  return sum % 10 === 0;
}
function normPhone(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('972')) d = '0' + d.slice(3);
  if (d.length === 9 && d[0] !== '0') d = '0' + d;
  if (d.length === 8 && /[234689]/.test(d[0])) d = '0' + d;
  return d;
}
const isEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v || ''));

/** משפחה עם דרכון: סומנה במפורש, או שבשדה ת״ז יש אותיות / המילה "דרכון" */
function isPassportFamily(values) {
  const p = String(values.passport == null ? '' : values.passport).trim();
  if (p && !/^(false|0|לא|no)$/i.test(p)) return true;
  return ['id_number', 'wife_id'].some((k) => /[A-Za-z]|דרכון/.test(String(values[k] || '')));
}
const cleanPassport = (v) => String(v || '').replace(/דרכון/g, '').replace(/[\s\-–.:\/#]/g, '').toUpperCase();

function validateFamily(values, fields, required) {
  const errors = {};
  const passport = isPassportFamily(values);
  fields.forEach((f) => {
    const v = String(values[f.key] == null ? '' : values[f.key]).trim();
    if (!v) { if (required.includes(f.key)) errors[f.key] = 'שדה חובה'; return; }
    if (f.type === 'id') {
      const israeli = !/[A-Za-z]/.test(v) && isValidIsraeliId(v);
      if (!israeli && passport && !/^[A-Z0-9]{5,15}$/.test(cleanPassport(v))) errors[f.key] = 'מספר דרכון לא תקין';
      else if (!israeli && !passport) errors[f.key] = 'מספר זהות לא תקין (אם זה דרכון – סמנו "דרכון")';
    }
    if (f.type === 'phone' && !/^0\d{8,9}$/.test(normPhone(v))) errors[f.key] = 'מספר טלפון לא תקין';
    if (f.type === 'email' && !isEmail(v)) errors[f.key] = 'כתובת מייל לא תקינה';
    if (f.type === 'int' && !/^\d{1,2}$/.test(v.replace(/\s/g, ''))) errors[f.key] = 'יש להזין מספר';
  });
  return errors;
}

// ---------------------------------------------------------------- הדבקה מאקסל
const normHeader = (h) => String(h || '').replace(/[\s"'׳״`.\-_:()/\\]/g, '').toLowerCase();

function parsePasted(text) {
  const rows = [];
  let row = [], cell = '', q = false;
  const s = String(text || '').replace(/\r\n?/g, '\n');
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) {
      if (c === '"' && s[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"' && cell === '') q = true;
    else if (c === '\t') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map((r) => r.map((c) => c.trim())).filter((r) => r.some(Boolean));
}

/** מחזיר מערך באורך הכותרות: לכל עמודה מפתח שדה או '' */
function mapHeaders(headers, fields) {
  const used = new Set();
  const out = headers.map(() => '');
  const normed = headers.map(normHeader);
  const isWifeHeader = (n) => n.includes('אישה') || n.includes('אשה');
  [true, false].forEach((exact) => {
    normed.forEach((n, i) => {
      if (out[i] || !n) return;
      let best = null, bestLen = 0;
      fields.forEach((f) => {
        if (used.has(f.key)) return;
        if (!exact && isWifeHeader(n) !== !!f.wife) return;
        (f.syn || []).forEach((w) => {
          const hit = exact ? n === w : (w.length > 2 && n.includes(w));
          if (hit && w.length > bestLen) { best = f; bestLen = w.length; }
        });
      });
      if (best) { out[i] = best.key; used.add(best.key); }
    });
  });
  return out;
}

function looksLikeHeader(row, fields) {
  const m = mapHeaders(row, fields);
  return m.filter(Boolean).length >= Math.min(2, row.length);
}

// ---------------------------------------------------------------- קריאת קובץ אקסל
let xlsxPromise = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxPromise) {
    const sources = ['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
    xlsxPromise = sources.reduce((p, src) => p.catch(() => new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error('load')));
      s.onerror = () => { s.remove(); reject(new Error('load')); };
      document.head.appendChild(s);
    })), Promise.reject(new Error('start'))).catch(() => {
      xlsxPromise = null;
      throw new Error('לא הצלחתי לטעון את רכיב קריאת האקסל. בדקו את החיבור לאינטרנט ונסו שוב.');
    });
  }
  return xlsxPromise;
}

function cellToText(v) {
  if (v === null || v === undefined) return '';
  if (v instanceof Date) return `${pad2(v.getDate())}/${pad2(v.getMonth() + 1)}/${v.getFullYear()}`;
  if (typeof v === 'number') return Number.isInteger(v) ? v.toFixed(0) : String(v);
  return String(v).replace(/[\u200e\u200f\u202a-\u202e]/g, '').trim();
}

/** קורא קובץ xlsx / xls / csv ומחזיר את כל הגיליונות כטבלאות טקסט */
async function readSpreadsheetFile(file) {
  if (!file) throw new Error('לא נבחר קובץ');
  if (file.size > 15 * 1024 * 1024) throw new Error('הקובץ גדול מדי');
  const XLSX = await loadXlsx();
  const buf = await file.arrayBuffer();
  let wb;
  try {
    wb = XLSX.read(buf, { type: 'array', cellDates: true });
  } catch (e) {
    throw new Error('לא הצלחתי לקרוא את הקובץ. יש לשמור אותו כקובץ Excel (xlsx) ולנסות שוב.');
  }
  const hiddenNames = new Set(((wb.Workbook && wb.Workbook.Sheets) || []).filter((s) => s.Hidden).map((s) => s.name));
  return wb.SheetNames.map((name) => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '', blankrows: false })
      .map((r) => r.map(cellToText));
    return { name, hidden: hiddenNames.has(name), rows: rows.filter((r) => r.some(Boolean)) };
  }).filter((s) => s.rows.length);
}

/** מאתר את שורת הכותרות בתוך 15 השורות הראשונות. מחזיר { index, score } */
function locateHeader(rows, fields) {
  let index = -1, score = 0;
  rows.slice(0, 15).forEach((r, i) => {
    const sc = mapHeaders(r, fields).filter(Boolean).length;
    if (sc > score) { index = i; score = sc; }
  });
  return score >= 2 ? { index, score } : { index: -1, score: 0 };
}

function bindDropZone(zone, input, onFile) {
  input.addEventListener('change', () => { if (input.files[0]) onFile(input.files[0]); input.value = ''; });
  ['dragenter', 'dragover'].forEach((ev) => zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.remove('over'); }));
  zone.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) onFile(f); });
}

/** אותו עיצוב כמו במייל: {צהוב}..{/} {אדום}..{/} {מודגש}..{/} {קו}..{/} {מרכז} בתחילת שורה, קישורים לחיצים */
function richText(text) {
  return String(text || '').split('\n').map((line) => {
    let center = false;
    if (line.startsWith('{מרכז}')) { center = true; line = line.slice(6); }
    const open = { 'צהוב': '<mark style="background:#ffff00;font-weight:700;padding:0 3px">', 'אדום': '<span style="color:#d00000;font-weight:700">', 'מודגש': '<b>', 'קו': '<u>' };
    const close = { 'צהוב': '</mark>', 'אדום': '</span>', 'מודגש': '</b>', 'קו': '</u>' };
    const stack = [];
    let html = esc(line).replace(/\{(צהוב|אדום|מודגש|קו|\/)\}/g, (m, tag) => {
      if (tag === '/') { const t = stack.pop(); return t ? close[t] : ''; }
      stack.push(tag); return open[tag];
    });
    while (stack.length) html += close[stack.pop()];
    html = html
      .replace(/(https?:\/\/[^\s<"&]+)/g, '<a href="$1" target="_blank" rel="noopener" dir="ltr" style="font-weight:700">$1</a>')
      .replace(/(^|[\s(:>])([\w.+-]+@[\w-]+\.[\w.]+)/g, '$1<a href="mailto:$2" dir="ltr">$2</a>');
    return center ? `<div style="text-align:center">${html}</div>` : `${html}<br>`;
  }).join('');
}

function downloadCsv(filename, rows) {
  const csv = '\uFEFF' + rows.map((r) => r.map((c) => {
    const s = String(c == null ? '' : c);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
</script>

<script>
const BOOT = { token: (new URLSearchParams(location.search).get('d') || location.hash.replace('#', '') || '').replace(/[^A-Za-z0-9]/g, '') };
let S = null;
let filter = lsGet('drv_filter', 'open');
const openNotes = new Set();
const openRecip = new Set();
let sheetMode = false;

const SKEY = 'drv_state';
function applyQueue() {
  if (!S || !OFFLINE_OK) return;
  qGet().forEach((it) => {
    const st = S.stops.find((x) => x.id === it.id);
    if (!st) return;
    st.delivered_at = it.delivered ? (st.delivered_at || new Date(it.at).toISOString()) : '';
    st.pending = true;
  });
}

async function load(quiet) {
  if (!S && OFFLINE_OK) {                       // מציגים מיד את מה שנשמר במכשיר, ומתעדכנים ברקע
    try {
      const cached = JSON.parse(localStorage.getItem(SKEY) || 'null');
      if (cached && cached.stops) { S = cached; applyQueue(); render(); }
    } catch (e) { /* אין מטמון */ }
  }
  try {
    S = await rpc('dDriverGetState', BOOT.token);
    if (OFFLINE_OK) { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) { /* אין מקום */ } }
    applyQueue();
    render();
  } catch (e) {
    if (S) return;                              // יש נתונים על המסך – לא מחליפים אותם בשגיאה
    if (!quiet || !S) $('#app').innerHTML = `<div class="card fullpage"><div style="font-size:44px">⚠️</div><h2>${e.message === 'INVALID_LINK' ? 'הקישור לא תקין' : 'שגיאה בטעינה'}</h2>
      <p class="muted">${e.message === 'INVALID_LINK' ? 'ייתכן שנוצר קישור חדש. יש לבקש מהמשרד את הקישור העדכני.' : esc(e.message)}</p>
      <button class="btn btn-primary" onclick="location.reload()">ניסיון נוסף</button></div>`;
  }
}

/** ווייז: כתובת + שם העיר מתחנת החלוקה (בלי "משאית"/שם איש קשר) */
const wazeUrl = (s) => {
  const city = String(s.station || s.area || '').replace(/^(משאית|נהג)\s+/, '').split(/\s*[-–]\s*/)[0].trim();
  const q = s.address ? [s.address, city].filter(Boolean).join(' ') : city;
  const params = `q=${encodeURIComponent(q)}&navigate=yes`;
  const web = `https:\/\/waze.com/ul?${params}`;
  // באנדרואיד קישור רגיל נפתח בדפדפן ("התקן את וויז") – intent פותח ישר את האפליקציה, ואם אינה מותקנת עובר לאתר
  if (/Android/i.test(navigator.userAgent)) {
    return `intent:\/\/?${params}#Intent;scheme=waze;package=com.waze;S.browser_fallback_url=${encodeURIComponent(web)};end`;
  }
  return web; // אייפון: הקישור הרגיל פותח את האפליקציה כשהוא נפתח בחלון הראשי
};

function render() {
  if (sheetMode) return renderSheet();
  const all = S.stops;
  const done = all.filter((s) => s.delivered_at);
  const pk = all.reduce((a, s) => a + Number(s.packages || 0), 0);
  const pkDone = done.reduce((a, s) => a + Number(s.packages || 0), 0);
  const pct = all.length ? Math.round(done.length / all.length * 100) : 0;
  const next = all.find((s) => !s.delivered_at);
  const list = all.filter((s) => filter === 'all' || (filter === 'open' ? !s.delivered_at : s.delivered_at));
  $('#app').innerHTML = `
    <div class="d-head">
      <h1>🚗 ${esc(S.truck.driver_name || S.truck.name)}</h1>
      <div class="sub">${esc(S.event.name)}${S.truck.driver_name && S.truck.name ? ' · ' + esc(S.truck.name) : ''}</div>
      ${S.truck.notes ? `<div class="alert info" style="margin-top:10px"><span class="a-icon">📌</span><div>${esc(S.truck.notes)}</div></div>` : ''}
      ${qGet().length ? `<div class="alert warn" style="margin-top:10px"><span class="a-icon">📶</span><div>${qGet().length} סימונים ממתינים לסנכרון. יישלחו לבד כשתהיה קליטה.</div></div>` : ''}
      <div class="d-prog"><div class="progress good"><div style="width:${pct}%"></div></div><b class="num">${done.length}/${all.length}</b></div>
      <div class="sub" style="margin-top:4px">נמסרו ${fmtNum(pkDone)} מתוך ${fmtNum(pk)} חבילות${next ? '' : all.length ? ' · <b style="color:var(--good-ink)">✓ סיימת את כל העצירות!</b>' : ''}</div>
      <button class="btn btn-ghost" id="sheetBtn" style="width:100%;justify-content:center;margin-top:12px">📄 דף נהג – צפייה, הדפסה והורדה</button>
      <div class="seg" style="margin-top:12px">${[['open', `לא נמסרו (${all.length - done.length})`], ['done', `נמסרו (${done.length})`], ['all', 'הכל']].map(([k, l]) => `<button data-f="${k}" class="${filter === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    </div>
    ${list.map((s) => stopCard(s, all.indexOf(s) + 1, next && next.id === s.id)).join('') || `<div class="card empty"><div class="e-icon">${filter === 'open' ? '🎉' : '📭'}</div><h3>${filter === 'open' ? 'אין עצירות שנשארו' : 'אין עצירות להצגה'}</h3></div>`}
    <div class="loc" id="locInfo"></div>
    <div style="text-align:center;margin-top:10px"><button class="btn btn-ghost btn-sm" id="reloadBtn">⟳ רענון</button></div>`;
  $$('[data-f]').forEach((b) => b.onclick = () => { filter = b.dataset.f; lsSet('drv_filter', filter); render(); });
  $('#reloadBtn').onclick = () => load();
  $('#sheetBtn').onclick = () => { sheetMode = true; render(); window.scrollTo(0, 0); };
  updateLocInfo();
}

// ---------------------------------------------------------------- דף נהג (כמו הדף המודפס במשרד)
function renderSheet() {
  $('#app').innerHTML = `
    <div class="sheet-bar">
      <button class="btn btn-ghost" id="sheetBack">→ חזרה לעצירות</button>
      <button class="btn btn-primary" id="sheetPdf">⬇️ הורדת PDF</button>
      <button class="btn btn-ghost" id="sheetPrint">🖨️ הדפסה</button>
    </div>
    <div class="sheet-scroll"><div class="sheet-doc" id="sheetDoc">${buildDriverSheet()}</div></div>`;
  $('#sheetBack').onclick = () => { sheetMode = false; render(); window.scrollTo(0, 0); };
  $('#sheetPrint').onclick = () => window.print();
  $('#sheetPdf').onclick = downloadSheetPdf;
  fitSheet();
}

/** מקטין את הדף לרוחב המסך (אפשר להגדיל באצבעות) */
function fitSheet() {
  const doc = $('#sheetDoc'); const box = $('.sheet-scroll');
  if (doc && box) doc.style.zoom = String(Math.min(1, box.clientWidth / 760));
}
window.addEventListener('resize', () => { if (sheetMode) fitSheet(); });

function buildDriverSheet() {
  const t = S.truck; const st = S.stops;
  const who = t.driver_name || t.name || 'נהג';
  const date = S.event.date ? fmtDate(S.event.date) : '';
  const pk = st.reduce((a, s) => a + Number(s.packages || 0), 0);
  const items = {};
  st.forEach((s) => Object.entries(s.items || {}).forEach(([k, v]) => { if (Number(v)) items[k] = (items[k] || 0) + Number(v); }));
  const prods = Object.keys(items);
  const recipPk = (s) => (s.recipients || []).reduce((a, r) => a + Number(r.packages || 0), 0);
  return `<div class="page sheet">
    <table class="hd"><tr>
      <td><div class="big">🚗 ${esc(who)}</div><div>${esc(S.event.name)}${date ? ' · ' + date : ''}${t.driver_name && t.name ? ' · מסלול: ' + esc(t.name) : ''}</div>
        <div>טלפון הנהג: <b>${esc(t.driver_phone) || '____________'}</b></div></td>
      <td style="text-align:left"><div class="big">${fmtNum(pk)} חבילות</div><div>${st.length} עצירות</div></td>
    </tr></table>
    ${t.notes ? `<div style="font-size:14px;font-weight:700;margin-bottom:6px">📌 ${esc(t.notes)}</div>` : ''}
    ${prods.length ? `<div style="margin:4px 0 8px;font-size:14px">להעמסה: ${prods.map((p) => `${esc(p)}: <b>${fmtNum(items[p])}</b>`).join(' · ')}</div>` : ''}
    <table class="grid"><thead><tr><th class="c">#</th><th>כתובת</th><th>איש קשר</th><th class="c">חבילות</th>${prods.length ? '<th>מה לתת</th>' : ''}<th>הערות</th><th class="c sig">נמסר ✓</th></tr></thead>
    <tbody>${st.map((s, i) => `<tr>
      <td class="s-n">${i + 1}</td>
      <td><div class="s-addr">${esc(s.address) || '<i>חסרה כתובת</i>'}</div><div class="s-area">${esc([s.area, s.station && s.station !== s.area ? 'תחנה: ' + s.station : ''].filter(Boolean).join(' · '))}</div>${(s.recipients || []).length ? `<div class="s-area"><b>+ רשימת ${s.recipients.length} מקבלים מצורפת</b></div>` : ''}</td>
      <td><b>${esc(s.contact)}</b><div>${esc(s.phone)}</div>${s.phone2 ? `<div>${esc(s.phone2)}</div>` : ''}</td>
      <td class="c" style="font-size:18px;font-weight:800">${esc(s.packages)}</td>
      ${prods.length ? `<td>${Object.entries(s.items || {}).filter(([, v]) => Number(v)).map(([k, v]) => `${esc(k)}: <b>${fmtNum(v)}</b>`).join('<br>')}</td>` : ''}
      <td class="s-notes">${esc(s.notes)}</td>
      <td class="sig">${s.delivered_at ? '✓' : ''}</td></tr>`).join('')}</tbody></table>
  </div>` + st.filter((s) => (s.recipients || []).length).map((s) => `<div class="page sheet">
    <table class="hd"><tr><td><div class="big">${esc(who)}</div><div>תחנת חלוקה: <b>${esc(s.station || s.area)}</b> · ${esc(s.address)} · ${esc(s.contact)} ${esc(s.phone)}</div></td>
      <td style="text-align:left"><div class="big">${s.recipients.length} משפחות</div><div>${fmtNum(recipPk(s))} חבילות</div></td></tr></table>
    <h2>רשימת מקבלים בתחנה</h2>
    <div style="font-size:12px;margin-bottom:6px">משפחות אלה מקבלות בתחנה, בנוסף לקבוצות שכבר נמצאות בה. יש לסמן ✓ כשהמשפחה קיבלה.</div>
    <table class="grid"><thead><tr><th class="c">#</th><th>שם משפחה</th><th>שם פרטי</th><th>ת״ז</th><th>טלפון</th><th class="c">חבילות</th><th class="c sig">קיבל ✓</th></tr></thead>
    <tbody>${s.recipients.map((r, i) => `<tr><td class="c">${i + 1}</td><td><b>${esc(r.last)}</b></td><td>${esc(r.first)}</td><td>${esc(r.id)}</td>
      <td style="white-space:nowrap">${esc(r.phone)}${r.phone2 && r.phone2 !== r.phone ? `<br>${esc(r.phone2)}` : ''}</td><td class="c" style="font-weight:800">${esc(r.packages)}</td><td class="sig"></td></tr>`).join('')}</tbody></table>
  </div>`).join('');
}

/** הורדת PDF – נוצר בשרת של גוגל (עברית תקינה), ויורד לטלפון */
const PDF_CSS = `<style>
  body { font-family: Arial, sans-serif; color: #000; font-size: 12px; direction: rtl; }
  .page + .page { page-break-before: always; }
  table { width: 100%; border-collapse: collapse; }
  .grid th, .grid td { border: 1px solid #000; padding: 4px 5px; vertical-align: top; text-align: right; }
  .grid th { background: #e6e6e6; font-weight: bold; }
  .c { text-align: center !important; }
  .big { font-size: 20px; font-weight: bold; }
  .hd { border-bottom: 3px solid #000; margin-bottom: 8px; }
  .hd td { vertical-align: top; padding: 0 0 6px; }
  .s-n { font-size: 15px; font-weight: bold; text-align: center; width: 24px; }
  .s-addr { font-size: 13px; font-weight: bold; }
  .s-area { font-size: 10px; }
  .s-notes { white-space: pre-wrap; font-size: 10.5px; }
  .sig { width: 60px; }
  h2 { font-size: 16px; margin: 4px 0; }
  tr { page-break-inside: avoid; }
</style>`;
async function downloadSheetPdf() {
  const b = $('#sheetPdf'); b.disabled = true; b.textContent = 'מכין קובץ…';
  try {
    const b64 = await rpc('dDriverPdf', BOOT.token, PDF_CSS + buildDriverSheet());
    const bin = atob(b64); const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    a.download = `דף נהג - ${S.truck.driver_name || S.truck.name || 'נהג'}.pdf`.replace(/[\\/:*?"<>|]/g, '');
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('הקובץ ירד לטלפון', { type: 'good', timeout: 3000 });
  } catch (e) {
    toast(`לא הצלחתי להוריד – ${esc(e.message || e)}. אפשר ללחוץ "הדפסה" ולבחור "שמירה כ-PDF".`, { type: 'error', timeout: 8000 });
  } finally {
    b.disabled = false; b.textContent = '⬇️ הורדת PDF';
  }
}

function stopCard(s, n, isNext) {
  const items = Object.entries(s.items || {}).filter(([, v]) => Number(v));
  const longNotes = s.notes && (s.notes.length > 140 || s.notes.split('\n').length > 3);
  return `<div class="stop ${s.delivered_at ? 'done' : ''} ${isNext ? 'next' : ''}">
    <div class="stop-top">
      <div class="stop-n">${n}</div>
      <div><div class="addr">${esc(s.address) || '<span class="muted">אין כתובת – להתקשר</span>'}</div><div class="area">${esc([s.area, s.station && s.station !== s.area ? 'תחנה: ' + s.station : ''].filter(Boolean).join(' · '))}</div></div>
      <div class="pk num">${esc(s.packages || 0)}<small>חבילות</small></div>
    </div>
    ${s.departed_at && !s.delivered_at ? `<div class="contact" style="color:var(--primary-strong)">🚗 יצאת ב-${fmtDateTime(s.departed_at).split(' ')[1] || ''}${s.eta_at ? ` · הגעה משוערת ${fmtDateTime(s.eta_at).split(' ')[1] || ''}` : ''}</div>` : ''}
    ${s.contact || s.phone ? `<div class="contact">👤 <b>${esc(s.contact)}</b> ${s.phone ? `<span class="num" dir="ltr">${esc(s.phone)}</span>` : ''}${s.phone2 ? ` · <span class="num" dir="ltr">${esc(s.phone2)}</span>` : ''}</div>` : ''}
    ${items.length ? `<div class="items">${items.map(([k, v]) => `<span class="item">${esc(k)} <b class="num">${fmtNum(v)}</b></span>`).join('')}</div>` : ''}
    ${s.notes ? `<div class="notes ${longNotes && !openNotes.has(s.id) ? 'collapsed' : ''}">${esc(s.notes)}</div>${longNotes ? `<button class="more" data-more="${s.id}">${openNotes.has(s.id) ? 'פחות ▲' : 'עוד ▼'}</button>` : ''}` : ''}
    ${(s.recipients || []).length ? `<button class="more" data-recip="${s.id}">👥 רשימת מקבלים בתחנה (${s.recipients.length}) ${openRecip.has(s.id) ? '▲' : '▼'}</button>
      ${openRecip.has(s.id) ? `<div class="recips">${s.recipients.map((r, i) => `<div class="rc"><span class="rn">${i + 1}</span><span><b>${esc(r.last)}</b> ${esc(r.first)}</span>${r.phone ? `<a href="tel:${esc(r.phone)}" class="num" dir="ltr">${esc(r.phone)}</a>` : '<span></span>'}<span class="rp">${esc(r.packages || '')}</span></div>`).join('')}</div>` : ''}` : ''}
    ${s.delivered_at ? `<div class="done-row"><span>✓ נמסר ב-${fmtDateTime(s.delivered_at).split(' ')[1] || ''}${s.pending ? ' · ממתין לסנכרון' : ''}</span><button class="btn btn-ghost btn-sm" data-undo="${s.id}">ביטול</button></div>` : `
    <div class="acts">
      ${s.address || s.area ? `<a class="btn btn-ghost" href="${wazeUrl(s)}" target="_top" data-nav="${s.id}">🧭 Waze</a>` : '<span></span>'}
      ${s.phone ? `<a class="btn btn-ghost" href="tel:${esc(s.phone)}">📞 חיוג</a>` : '<span></span>'}
      <button class="btn btn-deliver" data-give="${s.id}">✓ נמסר</button>
    </div>`}
  </div>`;
}

// ---------------------------------------------------------------- עבודה גם בלי קליטה (רק בגרסת האתר)
const OFFLINE_OK = typeof API_URL !== 'undefined';
const QKEY = 'drv_queue';
const qGet = () => { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } };
const qSet = (a) => { try { localStorage.setItem(QKEY, JSON.stringify(a)); } catch (e) { /* אין מקום */ } };
const isOffline = (e) => !navigator.onLine || /חיבור|Failed|NetworkError|Load failed/i.test(String((e && e.message) || e));

function queueMark(id, delivered) {
  const q = qGet().filter((x) => x.id !== id);
  q.push({ id, delivered, at: Date.now() });
  qSet(q);
  const s = S && S.stops.find((x) => x.id === id);
  if (s) { s.delivered_at = delivered ? new Date().toISOString() : ''; s.pending = true; }
}

let flushing = false;
async function flushQueue(quiet) {
  if (!OFFLINE_OK || flushing || !qGet().length || !navigator.onLine) return;
  flushing = true;
  try {
    for (const item of qGet().slice()) {
      try {
        S = await rpc('dDriverMark', BOOT.token, item.id, item.delivered);
        qSet(qGet().filter((x) => x.id !== item.id));
      } catch (e) { return; }
    }
    render();
    if (!quiet) toast('הכול סונכרן עם המשרד ✓', { type: 'good', timeout: 2500 });
  } finally { flushing = false; }
}
window.addEventListener('online', () => flushQueue());
setInterval(() => flushQueue(true), 30000);

async function mark(id, delivered) {
  const s = S.stops.find((x) => x.id === id);
  if (!s) return;
  const prev = s.delivered_at;
  s.delivered_at = delivered ? new Date().toISOString() : '';
  render();
  try {
    const p = delivered ? await quickPos(1500) : null;
    const c = p && p.coords;
    S = await rpc('dDriverMark', BOOT.token, id, delivered, c ? c.latitude : '', c ? c.longitude : '');
    render();
    if (delivered) toast(`✓ נמסר: ${esc(s.address || s.contact || '')}`, { type: 'good', timeout: 2500 });
  } catch (e) {
    if (OFFLINE_OK && isOffline(e)) {
      queueMark(id, delivered); render();
      toast('אין קליטה – נשמר במכשיר ויסונכרן אוטומטית', { type: 'warn', timeout: 4000 });
      return;
    }
    s.delivered_at = prev; render();
    toast(`לא נשמר – ${esc(e.message)}. בדקו חיבור ונסו שוב.`, { type: 'error', timeout: 7000 });
  }
}

/** מיקום נוכחי מהיר (אם אין – ממשיכים בלי) */
function quickPos(ms) {
  if (lastPos && Date.now() - lastPos.timestamp < 120000) return Promise.resolve(lastPos);
  if (!navigator.geolocation) return Promise.resolve(null);
  return new Promise((ok) => {
    let done = false;
    const finish = (p) => { if (!done) { done = true; ok(p); } };
    setTimeout(() => finish(lastPos), ms || 2500);
    navigator.geolocation.getCurrentPosition((p) => { lastPos = p; finish(p); }, () => finish(lastPos), { maximumAge: 120000, timeout: ms || 2500 });
  });
}

/** הנהג יצא לנקודה – נרשם במשרד עם שעה וזמן הגעה משוער */
async function reportDepart(id) {
  const p = await quickPos(1200);
  const c = p && p.coords;
  try { S = await rpc('dDriverDepart', BOOT.token, id, c ? c.latitude : '', c ? c.longitude : ''); render(); } catch (e) { /* לא קריטי */ }
}

document.addEventListener('click', async (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) reportDepart(nav.dataset.nav);   // לא מעכב את פתיחת ווייז
  const g = e.target.closest('[data-give]');
  if (g) { g.disabled = true; return mark(g.dataset.give, true); }
  const u = e.target.closest('[data-undo]');
  if (u) { if (await confirmDialog('ביטול מסירה', 'לסמן שהמשלוח הזה עוד לא נמסר?', 'כן, לבטל')) mark(u.dataset.undo, false); return; }
  const rb = e.target.closest('[data-recip]');
  if (rb) { const id = rb.dataset.recip; openRecip.has(id) ? openRecip.delete(id) : openRecip.add(id); render(); return; }
  const m = e.target.closest('[data-more]');
  if (m) { const id = m.dataset.more; openNotes.has(id) ? openNotes.delete(id) : openNotes.add(id); render(); }
});

// ---------------------------------------------------------------- מיקום (רק כשהדף פתוח ובאישור הנהג)
let locState = '';
let lastSent = 0;
let lastPos = null;
function updateLocInfo() { const el = $('#locInfo'); if (el) el.textContent = locState; }
function startLocation() {
  if (!navigator.geolocation) return;
  try {
    navigator.geolocation.watchPosition((pos) => {
      lastPos = pos;
      locState = '📍 המיקום משותף עם המשרד כשהדף פתוח';
      updateLocInfo();
      if (Date.now() - lastSent < 90 * 1000) return;
      lastSent = Date.now();
      rpc('dDriverLocation', BOOT.token, pos.coords.latitude, pos.coords.longitude).catch(() => {});
    }, () => { locState = ''; updateLocInfo(); }, { enableHighAccuracy: false, maximumAge: 60000, timeout: 30000 });
  } catch (e) { /* לא נתמך */ }
}

if (OFFLINE_OK && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => { /* לא קריטי */ });
}
load().then(startLocation).then(() => flushQueue(true));
setInterval(() => { if (!document.hidden && !sheetMode && !$('.modal-back')) load(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheetMode) load(true); });
</script>
</body>
